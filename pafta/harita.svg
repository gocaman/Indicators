<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 1112 712" width="1112" height="712">
  <title>Kentsel Bağlantılar – Harita</title>
  <defs>
    <clipPath id="kadraj"><rect width="1112" height="712"/></clipPath>
    <marker id="ok-mavi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b7fa6"/></marker>
    <marker id="ok-sari" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8892a"/></marker>
  </defs>

  <!-- 1) ARKA PLAN: CAD çıktısı. Gerçek CAD dosyasını gelince sadece bu href değişecek. -->
  <g id="arka-plan-cad" inkscape:groupmode="layer" inkscape:label="arka-plan-cad" clip-path="url(#kadraj)">
    <rect width="1112" height="712" fill="#ffffff"/>
    <image href="assets/cad-arka-plan-gecici.png" xlink:href="assets/cad-arka-plan-gecici.png" x="0" y="0" width="1112" height="712" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- 2) PROJE ALANI -->
  <g id="proje-alani" inkscape:groupmode="layer" inkscape:label="proje-alani">
    <rect x="605" y="363" width="24" height="27" fill="#c8102e" stroke="#7a0c1c" stroke-width="1.5"/>
  </g>

  <!-- 3) OKLAR -->
  <g id="oklar" inkscape:groupmode="layer" inkscape:label="oklar" fill="none" stroke-linecap="butt">
    <line id="ok-guzel-sanatlar" x1="590" y1="396" x2="868" y2="226" stroke="#b8892a" stroke-width="3" marker-end="url(#ok-sari)"/>
    <line id="ok-mimar-sinan" x1="697" y1="385" x2="905" y2="385" stroke="#5b7fa6" stroke-width="14" marker-end="url(#ok-mavi)"/>
    <line id="ok-mevlana" x1="520" y1="648" x2="895" y2="520" stroke="#5b7fa6" stroke-width="10" marker-end="url(#ok-mavi)"/>
    <line id="ok-sol-alt" x1="165" y1="585" x2="272" y2="712" stroke="#5b7fa6" stroke-width="6"/>
  </g>

  <!-- 4) YAZILAR (düzenlenebilir metin) -->
  <g id="yazilar" inkscape:groupmode="layer" inkscape:label="yazilar" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#b8892a">
    <text id="yazi-guzel-sanatlar" x="1000" y="170" text-anchor="middle"><tspan x="1000">KAZANCI BEDİH</tspan><tspan x="1000" dy="24">GÜZEL SANATLAR L.</tspan></text>
    <text id="yazi-mimar-sinan" x="975" y="380"><tspan x="975">MİMAR SİNAN</tspan><tspan x="975" dy="24">BULVARI</tspan></text>
    <text id="yazi-mevlana" x="940" y="484">MEVLANA BULVARI</text>
  </g>

  <!-- 5) ESKİ HARİTA: karşılaştırma için, varsayılan gizli -->
  <g id="eski-harita-referans" inkscape:groupmode="layer" inkscape:label="eski-harita-referans" style="display:none">
    <image href="assets/harita-eski-referans.png" xlink:href="assets/harita-eski-referans.png" width="1112" height="712"/>
  </g>
</svg>
