# BIST 100 hisselerinde gün içi (5 dk / 15 dk / 1 saat) strateji testi yapar ve her hisse için
# en iyisini "0. OTOMATİK SCALPER - BIST.txt" indikatörüne gömer. Yahoo 5/15 dakikalık veriyi
# sadece son 60 gün verdiği için haftada bir yenilenir.
name: BIST100 scalper testi

on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * 6"      # her cumartesi 07:43 (TSİ)
  push:
    paths:
      - "araclar/scalper.py"
      - "araclar/backtest.py"
      - "araclar/bist100.txt"
      - ".github/workflows/scalper-test.yml"

permissions:
  contents: write

concurrency:
  group: scalper-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: pip install yfinance pandas numpy

      - name: Gün içi testi çalıştır
        run: python araclar/scalper.py

      - name: Scalper indikatörünü sonuçlarla yeniden üret
        run: python araclar/pine_uret.py --scalper

      - name: Sonuçları kaydet
        # Diğer görev aynı dala yazmış olabilir: en güncel hali alıp sonuçları üstüne koy,
        # indikatörü güncel üreticiyle yeniden üret, sonra gönder (çakışma olursa tekrar dene).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/sonuc
          cp "veri/scalper_sonuclar.json" "veri/SCALPER_SONUCLAR.md" /tmp/sonuc/
          for deneme in 1 2 3 4; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            cp /tmp/sonuc/* veri/
            python araclar/pine_uret.py --scalper
            git add veri "0. OTOMATİK SCALPER - BIST.txt"
            if git diff --cached --quiet; then
              echo "Değişiklik yok"
              exit 0
            fi
            git commit -q -m "BIST 100 scalper sonuçları güncellendi ($(date +%Y-%m-%d))"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Gönderim çakıştı, tekrar deneniyor ($deneme)"
            sleep $((deneme * 10))
          done
          exit 1
