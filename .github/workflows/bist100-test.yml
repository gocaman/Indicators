# BIST 100 hisselerinde tüm strateji ve kombinleri test eder, her hisse için en iyisini
# "0. OTOMATİK EN İYİ STRATEJİ - BIST.txt" indikatörüne gömer.
name: BIST100 strateji testi

on:
  workflow_dispatch:          # Actions sekmesinden elle çalıştırma
  schedule:
    - cron: "17 3 1 * *"      # her ayın 1'i, 06:17 (TSİ)
  push:
    paths:
      - "araclar/backtest.py"
      - "araclar/pine_uret.py"
      - "araclar/bist100.txt"
      - ".github/workflows/bist100-test.yml"

permissions:
  contents: write

concurrency:
  group: bist100-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: pip install yfinance pandas numpy

      - name: BIST 100 testini çalıştır
        run: python araclar/backtest.py

      - name: İndikatörü sonuçlarla yeniden üret
        run: python araclar/pine_uret.py

      - name: Sonuçları kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add veri "0. OTOMATİK EN İYİ STRATEJİ - BIST.txt"
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "BIST 100 test sonuçları güncellendi ($(date +%Y-%m-%d))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
